name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy statsmodels arch pyyaml pyarrow joblib pytest ruff matplotlib tabulate
      - name: Ruff
        run: ruff check --no-cache src tests scripts
      - name: Pytest (dữ liệu mẫu nhỏ trong tests/fixtures)
        run: python -m pytest -q tests
